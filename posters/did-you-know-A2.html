<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הידעת ש A2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* Layout: A2 portrait series. One question, one giant number, one line of meaning; logo signs off at the foot */
@page{size:420mm 594mm;margin:0}
.sheet{width:420mm;height:594mm;display:flex;flex-direction:column;align-items:center;text-align:center;padding:42mm 38mm 34mm}
.frame{inset:14mm;border-width:1mm}
.frame::after{inset:3.2mm;border-width:.35mm}
.no{position:absolute;top:24mm;left:26mm;font-family:var(--display);font-weight:700;font-size:20pt;color:var(--gold-lt);letter-spacing:.1em}
.q{font-family:var(--display);font-weight:900;font-size:120pt;line-height:1;color:var(--gold-hi)}
.orn{gap:5mm;margin:9mm 0 0}
.orn::before,.orn::after{width:56mm;height:.45mm}
.orn svg{width:8mm;height:8mm}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9mm;width:100%}
.lead{font-family:var(--display);font-weight:500;font-size:54pt;line-height:1.3;margin:0;text-wrap:balance;max-width:320mm}
.big{font-family:var(--display);font-weight:900;font-size:300pt;line-height:.95;white-space:nowrap}
.big .cur{font-size:.45em;margin-inline-start:4mm}
.big.long{font-size:205pt}
.after{font-family:var(--display);font-weight:700;font-size:62pt;line-height:1.3;margin:0;color:var(--ivory);text-wrap:balance;max-width:330mm}
.note{font-weight:600;font-size:34pt;color:var(--soft);margin:0;text-wrap:balance;max-width:320mm}
.sign{display:flex;flex-direction:column;align-items:center;gap:3mm}
.sign img{width:135mm}
.sign span{font-weight:800;letter-spacing:.12em;color:var(--gold-lt);font-size:24pt}
</style>
</head>
<body>
<div id="out"></div>
<script>
const STAR = '<svg viewBox="0 0 20 20"><path d="M10 0C10.8 7 13 9.2 20 10C13 10.8 10.8 13 10 20C9.2 13 7 10.8 0 10C7 9.2 9.2 7 10 0Z" fill="currentColor"/></svg>';
const FACTS = [
  { lead: 'משפחה אחת, בלי עשירים גדולים ובלי קרנות, הכניסה לקופה', big: '152,599', cur: '₪', after: 'בשש שנים, שקל אחר שקל', note: '' },
  { lead: 'הקופה כבר הייתה שותפה ב־', big: '15', after: 'חתונות במשפחה', note: '10,000 ₪ לכל חתונה, 150,000 ₪ בסך הכול' },
  { lead: 'מכל שקל שנכנס לקופה', big: '98.3%', after: 'יצא ישירות לשמחות', note: 'סך כל ההוצאות בשש שנים: 500 ₪ בלבד' },
  { lead: 'בממוצע, בכל', big: '5', after: 'חודשים חוגגת המשפחה עוד חתונה בעזרת הקופה', note: '15 חתונות ב־72 חודשים' },
  { lead: 'שמונה שותפים נתנו כל אחד מעל 12,000 ₪, ויחד הביאו', big: '80%', after: 'מכלל התרומות לקופה', note: '120,900 ₪ מתוך 150,499 ₪' },
  { lead: 'אם 16 בני המשפחה יוסיפו 101 ₪, ועוד 15 נכדים יצטרפו ב־200 ₪ בחודש, ייכנסו לקופה', big: '4,616', cur: '₪', after: 'נוספים בכל חודש', note: 'מכ־2,100 ₪ לכ־6,700 ₪ בחודש. וביחד נשבור שיאים חדשים!' }
];
const num = s => s.replace(/[\d,.%]+/g, m => `<span class="num">${m}</span>`);
document.getElementById('out').innerHTML = FACTS.map((f, i) => `
<section class="sheet">
  <div class="frame"></div>
  <div class="no"><span class="num">${i + 1} / ${FACTS.length}</span></div>
  <div class="q">הידעת ש...?</div>
  <div class="orn">${STAR}</div>
  <div class="body">
    <p class="lead">${num(f.lead)}</p>
    <div class="big goldtext${f.big.length > 6 ? ' long' : ''}"><span class="num">${f.big}</span>${f.cur ? `<span class="cur">${f.cur}</span>` : ''}</div>
    <p class="after">${num(f.after)}</p>
    ${f.note ? `<p class="note">${num(f.note)}</p>` : ''}
  </div>
  <div class="sign"><img src="assets/od-logo-hires.png" alt="קופת הצדקה עוד ישמע"><span>״מיר זענען אלע א חלק פון די שמחה״</span></div>
</section>`).join('');
</script>
</body>
</html>
