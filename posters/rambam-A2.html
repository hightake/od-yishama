<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הרמב״ם פסק A2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* Layout: A2 portrait in the style of the "הרמב״ם פסק" campaign: the ruling as a giant headline on the right, the Rambam's portrait on the left, the source quoted in full below */
@page{size:420mm 594mm;margin:0}
.sheet{width:420mm;height:594mm;display:flex;flex-direction:column}
.frame{inset:14mm;border-width:1mm;z-index:3}
.frame::after{inset:3.2mm;border-width:.35mm}
.top{display:grid;grid-template-columns:1fr 178mm;height:330mm}
.head{padding:44mm 30mm 0 10mm;display:flex;flex-direction:column;gap:6mm;z-index:2}
.head .k{font-family:var(--display);font-weight:900;font-size:118pt;line-height:.95;color:var(--ivory)}
.head .k span{color:var(--gold-hi)}
.head h1{font-family:var(--display);font-weight:900;font-size:104pt;line-height:1;margin:6mm 0 0}
.head .bar{width:120mm;height:2mm;background:linear-gradient(90deg,var(--gold-lt),transparent);margin:5mm 0 2mm}
.head p{margin:0;font-family:var(--display);font-weight:700;font-size:46pt;line-height:1.3;color:var(--ivory)}
.portrait{position:relative;margin:30mm 0 0 30mm;border-radius:84mm 84mm 0 0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,#f6eedd,#e6d8bc 80%);border:1mm solid var(--gold-lt);border-bottom:0}
.portrait img{position:absolute;left:50%;bottom:6mm;width:118%;max-width:none;transform:translateX(-50%)}
.portrait::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(0deg,var(--navy),transparent)}
.cap{position:absolute;bottom:10mm;left:0;right:0;text-align:center;z-index:2;font-family:var(--display);font-weight:700;font-size:26pt;color:var(--gold-hi)}
.src{margin:16mm 30mm 0;padding:14mm 0 12mm;border-top:.8mm solid var(--gold-lt);border-bottom:.8mm solid var(--gold-lt);text-align:center;position:relative;z-index:2}
.src .line{font-family:var(--display);font-weight:900;font-size:104pt;line-height:1.12}
.src cite{display:block;margin-top:6mm;font-style:normal;font-family:var(--display);font-weight:700;font-size:40pt;color:var(--ivory)}
.foot{margin-top:auto;padding:0 30mm 26mm;display:flex;align-items:center;justify-content:center;gap:10mm}
.foot img{width:125mm}
.foot div{font-family:var(--display);font-weight:700;font-size:34pt;line-height:1.35;color:var(--ivory);border-right:.8mm solid var(--gold-lt);padding-right:10mm}
.foot div span{display:block;color:var(--gold-hi);font-size:24pt}
</style>
</head>
<body>
<section class="sheet">
  <div class="frame"></div>
  <div class="top">
    <div class="head">
      <div class="k"><span>הרמב״ם</span><br>פסק:</div>
      <h1 class="goldtext">הצדקה הגדולה ביותר!</h1>
      <div class="bar"></div>
    </div>
    <div class="portrait">
      <img src="assets/rambam.svg" alt="הרמב״ם">
      <div class="cap">רבינו משה בן מימון זי״ע</div>
    </div>
  </div>

  <div class="src">
    <div class="line goldtext">״עני שהוא קרובו<br>קודם לכל אדם״</div>
    <cite>(מתנות עניים ז, יג)</cite>
  </div>

  <div class="foot">
    <img src="assets/od-logo-hires.png" alt="קופת הצדקה עוד ישמע">
    <div>קופת ״עוד ישמע״ מחזקת את ידי המשפחה<br>בשעת השמחה<span>״מיר זענען אלע א חלק פון די שמחה״</span></div>
  </div>
</section>
</body>
</html>
