<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Assistant:wght@600;700;800&display=swap">
<style>
body{margin:0;width:1600px;font-family:"Assistant",Arial,sans-serif}
.row{display:grid;grid-template-columns:1fr 1fr}
.cell{height:520px;display:grid;place-items:center}
.navy{background:radial-gradient(ellipse at 50% 40%,#221c33,#14111f 75%);color:#fbf7ee}
.ivory{background:#fbf7ee;color:#14111f}
.stack{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.stack img{width:190px}
.name{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:50px;line-height:1}
.title{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:27px;color:#b08a3e}
.navy .title{color:#e3c47e}
.tag{font-weight:700;letter-spacing:.16em;font-size:17px;opacity:.75;display:flex;align-items:center;gap:12px}
.tag::before,.tag::after{content:"";width:40px;height:1px;background:currentColor;opacity:.6}
.horiz{display:flex;align-items:center;gap:28px}
.horiz img{width:150px}
.horiz .txt{display:flex;flex-direction:column;gap:8px;border-right:2px solid #b08a3e;padding-right:28px}
.horiz .name{font-size:46px}
.horiz .tag{justify-content:flex-start}
.horiz .tag::before{display:none}
</style></head><body>
<div class="row">
  <div class="cell navy"><div class="stack"><img src="zichrman-logo.svg"><div class="name">אברהם שמואל זיכרמן</div><div class="title">ליווי והכוונה לבחורים</div><div class="tag">משפיע · מלווה · לומד יחד</div></div></div>
  <div class="cell ivory"><div class="stack"><img src="zichrman-logo.svg"><div class="name">אברהם שמואל זיכרמן</div><div class="title">ליווי והכוונה לבחורים</div><div class="tag">משפיע · מלווה · לומד יחד</div></div></div>
</div>
<div class="row">
  <div class="cell navy" style="height:300px"><div class="horiz"><img src="zichrman-logo.svg"><div class="txt"><div class="name">אברהם שמואל זיכרמן</div><div class="title">ליווי והכוונה לבחורים</div><div class="tag">משפיע · מלווה · לומד יחד</div></div></div></div>
  <div class="cell ivory" style="height:300px"><div class="horiz"><img src="zichrman-logo.svg"><div class="txt"><div class="name">אברהם שמואל זיכרמן</div><div class="title">ליווי והכוונה לבחורים</div><div class="tag">משפיע · מלווה · לומד יחד</div></div></div></div>
</div>
</body></html>
